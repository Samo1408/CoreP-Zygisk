name: Build CorePatch Zygisk Module

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Build/job identifier'
        required: true
        type: string
      java_version:
        description: 'JDK version (leave 17 for CorePatch)'
        required: false
        default: '17'
        type: string

permissions:
  contents: read

concurrency:
  group: corepatch-${{ github.ref }}-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CorePatch Zygisk
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      JAVA_VERSION: ${{ inputs.java_version }}
      JOB_ID: ${{ inputs.job_id }}
      ANDROID_COMPILE_SDK: '37'
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK: '28.2.13676358'
      COREPATCH_CMAKE: '3.28.1'

    steps:
      - name: Checkout CorePatch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip zip curl wget jq file tar

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Detect project versions and choose Gradle automatically
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          WRAPPER="$ROOT/gradle/wrapper/gradle-wrapper.properties"

          # Detect AGP from plugins blocks, buildscript dependencies, or version catalog.
          AGP_VERSION=""
          if [ -f "$ROOT/gradle/libs.versions.toml" ]; then
            AGP_VERSION=$(grep -E '^[[:space:]]*agp[[:space:]]*=' "$ROOT/gradle/libs.versions.toml" \
              | grep -oE '[0-9]+\.[0-9]+(?:\.[0-9]+)?' | tail -1 || true)
          fi

          if [ -z "$AGP_VERSION" ]; then
            AGP_VERSION=$(grep -RhoE \
              '(com\.android\.application|com\.android\.library)[^0-9]{0,100}[0-9]+\.[0-9]+(?:\.[0-9]+)?' \
              "$ROOT" --include='*.gradle' --include='*.gradle.kts' 2>/dev/null \
              | grep -oE '[0-9]+\.[0-9]+(?:\.[0-9]+)?' | sort -Vu | tail -1 || true)
          fi

          # Map AGP major/minor to its documented Gradle compatibility.
          gradle_for_agp() {
            case "$1" in
              9.2.*|9.2) echo '9.4.1' ;;
              9.1.*|9.1) echo '9.3.1' ;;
              9.0.*|9.0) echo '9.1.0' ;;
              8.13.*|8.13) echo '8.13' ;;
              8.12.*|8.12) echo '8.13' ;;
              8.11.*|8.11) echo '8.13' ;;
              8.10.*|8.10) echo '8.11.1' ;;
              8.9.*|8.9) echo '8.11.1' ;;
              8.8.*|8.8) echo '8.10.2' ;;
              8.7.*|8.7) echo '8.9' ;;
              8.6.*|8.6) echo '8.7' ;;
              8.5.*|8.5) echo '8.7' ;;
              8.4.*|8.4) echo '8.6' ;;
              8.3.*|8.3) echo '8.4' ;;
              8.2.*|8.2) echo '8.2' ;;
              8.1.*|8.1) echo '8.0' ;;
              8.0.*|8.0) echo '8.0' ;;
              *) echo '' ;;
            esac
          }

          REQUIRED_GRADLE="$(gradle_for_agp "$AGP_VERSION")"
          WRAPPER_GRADLE=""
          if [ -f "$WRAPPER" ]; then
            WRAPPER_GRADLE=$(grep -E '^distributionUrl=' "$WRAPPER" \
              | sed -E 's/.*gradle-([0-9]+\.[0-9]+(?:\.[0-9]+)?)(-[^/]+)?\.zip.*/\1/' \
              | head -1 || true)
          fi

          if [ -n "$REQUIRED_GRADLE" ]; then
            SELECTED_GRADLE="$REQUIRED_GRADLE"
          elif [ -n "$WRAPPER_GRADLE" ]; then
            SELECTED_GRADLE="$WRAPPER_GRADLE"
          else
            echo '::error::Unable to determine Gradle version: AGP was not detected and no Gradle wrapper exists.'
            exit 1
          fi

          echo "AGP_VERSION=$AGP_VERSION" >> "$GITHUB_ENV"
          echo "GRADLE_VERSION=$SELECTED_GRADLE" >> "$GITHUB_ENV"
          echo "agp=$AGP_VERSION" >> "$GITHUB_OUTPUT"
          echo "gradle=$SELECTED_GRADLE" >> "$GITHUB_OUTPUT"

          echo "Detected AGP: ${AGP_VERSION:-unknown}"
          echo "Wrapper Gradle: ${WRAPPER_GRADLE:-missing}"
          echo "Selected Gradle: $SELECTED_GRADLE"

          # Keep the project structure untouched except for the wrapper URL when
          # AGP requires a different Gradle version. This avoids running an
          # incompatible wrapper while preserving all source/build files.
          if [ -n "$REQUIRED_GRADLE" ] && [ -f "$WRAPPER" ] && [ "$WRAPPER_GRADLE" != "$REQUIRED_GRADLE" ]; then
            sed -i -E "s#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-${REQUIRED_GRADLE}-bin.zip#" "$WRAPPER"
            echo "Updated only gradle-wrapper.properties: $WRAPPER_GRADLE -> $REQUIRED_GRADLE"
          elif [ -n "$REQUIRED_GRADLE" ] && [ ! -f "$WRAPPER" ]; then
            echo '::error::AGP was detected, but gradle-wrapper.properties is missing. Add the wrapper to the project instead of modifying project structure in CI.'
            exit 1
          fi

      - name: Install requested CMake
        shell: bash
        run: |
          set -euo pipefail

          CMAKE_VERSION="${COREPATCH_CMAKE}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          CMAKE_DIR="${SDK_ROOT}/cmake/${CMAKE_VERSION}"

          if [ -x "${CMAKE_DIR}/bin/cmake" ]; then
            echo "CMake ${CMAKE_VERSION} already available."
            exit 0
          fi

          mkdir -p "${SDK_ROOT}/cmake"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          URL="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          echo "Downloading CMake ${CMAKE_VERSION} from the official CMake release."
          curl -fL --retry 5 --retry-delay 2 "$URL" -o "$TMP/cmake.tar.gz"
          tar -xzf "$TMP/cmake.tar.gz" -C "$TMP"
          EXTRACTED="$TMP/cmake-${CMAKE_VERSION}-linux-x86_64"
          test -x "$EXTRACTED/bin/cmake"
          rm -rf "$CMAKE_DIR"
          mv "$EXTRACTED" "$CMAKE_DIR"
          echo "CMake ${CMAKE_VERSION} installed at ${CMAKE_DIR}"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-37|build-tools;36\.0\.0|ndk;28\.2\.13676358' || true
          "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmake/${COREPATCH_CMAKE}/bin/cmake" --version
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME} }"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version --no-daemon --console=plain

      - name: Build CorePatch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

          # CorePatch defines this task explicitly in app/build.gradle.kts.
          # Run it directly so a task-list parsing failure cannot hide the real
          # Gradle configuration error.
          echo "Running CorePatch task: :app:zygiskModuleZip"
          ../gradlew :app:zygiskModuleZip --no-configuration-cache

      - name: Validate generated module
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(find . -type f -name '*.zip' \
            ! -path './.git/*' \
            ! -path '*/.gradle/*' \
            -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)

          OUTPUT=""
          for zip in "${ZIPS[@]}"; do
            if unzip -l "$zip" 2>/dev/null | grep -Eq '(^|[[:space:]])module\.prop$'; then
              OUTPUT="$zip"
              break
            fi
          done

          if [ -z "$OUTPUT" ]; then
            echo '::error::No generated Magisk/Zygisk ZIP containing root-level module.prop was found.'
            exit 1
          fi

          unzip -tq "$OUTPUT"
          unzip -l "$OUTPUT" | sed -n '1,160p'

          if ! unzip -l "$OUTPUT" | grep -Eq '(^|[[:space:]])module\.prop$'; then
            echo '::error::module.prop is not at ZIP root.'
            exit 1
          fi

          if unzip -l "$OUTPUT" | grep -Eq '\.apk$'; then
            echo '::error::Zygisk artifact contains an APK.'
            exit 1
          fi

          echo "OUTPUT=$OUTPUT" >> "$GITHUB_ENV"
          echo "OUTPUT_NAME=$(basename "$OUTPUT")" >> "$GITHUB_ENV"

      - name: Upload CorePatch module
        uses: actions/upload-artifact@v4
        with:
          name: CorePatch-Zygisk-${{ inputs.job_id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CorePatch Zygisk Build'
            echo ''
            echo '| Item | Value |'
            echo '|---|---|'
            echo "| Job ID | ${JOB_ID} |"
            echo "| AGP | ${AGP_VERSION:-unknown} |"
            echo "| Gradle | ${GRADLE_VERSION:-unknown} |"
            echo "| Java | ${JAVA_VERSION} |"
            echo "| compileSdk | ${ANDROID_COMPILE_SDK} |"
            echo "| Build Tools | ${ANDROID_BUILD_TOOLS} |"
            echo "| NDK | ${ANDROID_NDK} |"
            echo "| CMake | ${COREPATCH_CMAKE} |"
            echo "| Output | ${OUTPUT_NAME:-not produced} |"
          } >> "$GITHUB_STEP_SUMMARY"
