name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.28.1"

      - name: Build with Gradle
        run: ./gradlew --no-daemon assembleRelease assembleDebug zygiskModuleZip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            app/build/outputs/apk
            app/build/dist/*.zip
